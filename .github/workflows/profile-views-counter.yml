name: Update Profile Views Counter

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-counter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate views counter SVG
        run: |
          mkdir -p dist
          cat > dist/views-counter.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="400" height="60" viewBox="0 0 400 60">
            <defs>
              <style>
                @keyframes pulse {
                  0%, 100% { opacity: 1; }
                  50% { opacity: 0.6; }
                }
                .counter-text {
                  font-family: 'Courier New', monospace;
                  font-size: 24px;
                  font-weight: bold;
                  fill: #1F6FEB;
                  animation: pulse 2s infinite;
                }
                .label-text {
                  font-family: 'Courier New', monospace;
                  font-size: 16px;
                  fill: #888;
                }
              </style>
            </defs>
            <rect width="400" height="60" fill="transparent"/>
            <text x="20" y="35" class="label-text">👀 Profile Views:</text>
            <text x="200" y="35" class="counter-text">43+ 🔥</text>
            <text x="20" y="55" class="label-text">⚡ Keep Building</text>
          </svg>
          EOF

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "📊 Update profile views counter"
          file_pattern: dist/views-counter.svg
